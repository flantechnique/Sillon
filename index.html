<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>Sillon</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sillon">
<style>
:root {
  --bg: #0d0c0b;
  --fg: #f3eee6;
  --dim: #9c958a;
  --accent: #e8b04a;
  --line: rgba(255,255,255,.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }

#feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
#feed::-webkit-scrollbar { display: none; }

.card { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 20px 32px; overflow: hidden; }
.card .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.35) saturate(1.3); z-index: 0; }
.card > *:not(.bgimg) { position: relative; z-index: 1; }
.cover { width: min(72vw, 52vh, 420px); aspect-ratio: 1; border-radius: 6px; background: #222 center/cover; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.disc { position: absolute; inset: 0; border-radius: 6px; display: grid; place-items: center; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .2s; font-size: 48px; }
.card.paused .disc { opacity: 1; }
.meta { width: min(86vw, 520px); margin-top: 28px; }
.title { font-size: clamp(20px, 3.4vh, 28px); font-weight: 700; line-height: 1.2; }
.artist { font-size: 17px; color: var(--accent); margin-top: 6px; font-weight: 600; }
.sub { font-size: 13px; color: var(--dim); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.bar { width: min(86vw, 520px); height: 3px; background: var(--line); margin-top: 22px; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--fg); }

.meta { display: flex; gap: 14px; align-items: flex-start; }
.meta .txt { flex: 1; min-width: 0; }
.side { display: flex; gap: 10px; flex: none; }
.side button, .side a { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.45); border: 1px solid var(--line); display: grid; place-items: center; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.side .keep.on { background: var(--accent); color: #111; border-color: var(--accent); }
.side svg { width: 22px; height: 22px; }
.side .report { color: var(--dim); }
.src { margin-top: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); text-decoration: none; opacity: .7; }
.src:hover { opacity: 1; }
@media (max-width: 560px) {
  .meta { flex-direction: column; gap: 16px; }
  .side { width: 100%; justify-content: space-between; }
  .side .report { margin-right: auto; }
  .side .keep { margin-right: 6px; }
}

#toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; z-index: 30; background: rgba(0,0,0,.8); border: 1px solid var(--line); padding: 8px 16px; border-radius: 99px; font-size: 13px; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }


.loading { color: var(--dim); font-size: 14px; letter-spacing: .1em; }
.spin { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: r 1s linear infinite; margin-bottom: 16px; }
@keyframes r { to { transform: rotate(360deg); } }

header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; z-index: 16; pointer-events: none; }
header > * { pointer-events: auto; }
.logo { font-weight: 800; letter-spacing: .18em; font-size: 14px; }
.hbtns { display: flex; gap: 8px; }
.pill { font-size: 12px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: rgba(0,0,0,.45); color: var(--dim); }
.pill.on { color: #111; background: var(--accent); border-color: var(--accent); }

#start { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center; }
#start h1 { font-size: 44px; letter-spacing: .25em; font-weight: 800; }
#start p { color: var(--dim); max-width: 340px; line-height: 1.5; }
#go { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: #111; font-size: 34px; display: grid; place-items: center; }
#go svg { width: 40px; height: 40px; margin-left: 6px; }

#kept { position: fixed; inset: 0; z-index: 15; background: rgba(13,12,11,.97); overflow-y: auto; padding: 64px 16px 32px; display: none; }
#kept.open { display: block; }
#kept ul { list-style: none; max-width: 560px; margin: 0 auto; }
#kept li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
#kept img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; flex: none; background: #222; }
#kept .t { flex: 1; min-width: 0; }
#kept .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kept .t span { color: var(--accent); font-size: 14px; }
#kept .t small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
#kept .x { color: var(--dim); font-size: 20px; padding: 8px; }
#kept .empty { text-align: center; color: var(--dim); margin-top: 30vh; }
#kept .row a { font-size: 12px; color: var(--dim); margin-right: 10px; }

</style>
</head>
<body>

<div id="start">
  <h1>SILLON</h1>
  <p>Un titre au hasard, d'un artiste au hasard, parmi tout le catalogue. Faites défiler pour passer.</p>
  <button id="go" aria-label="Lancer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></button>
</div>

<header>
  <div class="logo">SILLON</div>
  <div class="hbtns">
    <button class="pill" id="keptBtn">Gardés <span id="keptN"></span></button>
  </div>
</header>

<div id="feed"></div>
<div id="kept"><ul></ul></div>
<audio id="audio" preload="auto"></audio>

<script src="filter.js"></script>
<script>
const { SPOKEN, AMBIENCE, normLabel, isMusic, randomId } = SillonFilter;
const BATCH = 10;
const AHEAD = 3;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('sillon.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sillon.' + k, JSON.stringify(v)); } catch {} },
};
const seenArtists = new Set(store.get('seen', []));
let kept = store.get('kept', []);

// --- Signalements partagés (Supabase, clé publique : insertion et lecture de la liste de blocage seulement) ---
const SB_URL = 'https://nqigjixiqtaavfscqhag.supabase.co';
const SB_KEY = 'sb_publishable_il0mHmr3JCISQaX-QeevDg_tKOmG3E4';
const SB_HEADERS = { apikey: SB_KEY, 'Content-Type': 'application/json' };
// Identifiant d'appareil aléatoire : sert seulement à repérer les doublons de signalement.
const device = store.get('device', null) || (() => { const id = crypto.randomUUID(); store.set('device', id); return id; })();
// Liste d'exclusion décidée après relecture des signalements (fermes à contenu, pas des artistes).
const blocks = { artists: new Set(), labels: new Set() };
try { localStorage.removeItem('sillon.blocks'); } catch {} // ancienne version : blocages locaux abandonnés

const sharedBlocks = fetch(SB_URL + '/rest/v1/rpc/sillon_blocklist', { method: 'POST', headers: SB_HEADERS, body: '{}' })
  .then(r => r.ok ? r.json() : [])
  .then(rows => rows.forEach(({ kind, value }) => (kind === 'artist' ? blocks.artists : blocks.labels).add(value)))
  .catch(() => {});

// --- Deezer (JSONP, pas de CORS sur l'API) ---
let cbN = 0;
function dz(path, timeout = 6000) {
  return new Promise((resolve, reject) => {
    const name = '__dz' + (cbN++);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout);
    function cleanup() { clearTimeout(t); delete window[name]; s.remove(); }
    window[name] = data => { cleanup(); data && data.error ? reject(data.error) : resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('net')); };
    s.src = 'https://api.deezer.com' + path + (path.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + name;
    document.head.appendChild(s);
  });
}

// --- Réserve : titres tirés au hasard et filtrés chaque jour par GitHub Actions (tools/build-pool.js) ---
// Une seule requête Deezer par titre (pour un extrait frais) au lieu d'une vingtaine.
const pool = { queue: [], chunks: null, version: '', loading: null };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function loadChunk() {
  if (!pool.chunks) {
    const idx = await fetch('pool/index.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    pool.chunks = idx && idx.chunks ? shuffle([...Array(idx.chunks).keys()]) : [];
    pool.version = idx ? idx.updated : '';
  }
  const n = pool.chunks.pop();
  if (n === undefined) return;
  const rows = await fetch(`pool/${n}.json?v=${encodeURIComponent(pool.version)}`).then(r => r.json()).catch(() => []);
  pool.queue.push(...shuffle(rows));
}

async function fromPool() {
  for (let tries = 0; tries < 40; tries++) {
    if (!pool.queue.length) {
      await (pool.loading ||= loadChunk().finally(() => { pool.loading = null; }));
      if (!pool.queue.length) return null; // réserve épuisée ou absente
    }
    const e = pool.queue.pop(); // { i: titre, a: artiste, g: genre, l: label }
    if (seenArtists.has(e.a) || blocks.artists.has(String(e.a)) || blocks.labels.has(normLabel(e.l))) continue;
    let tr;
    try { tr = await dz('/track/' + e.i); }
    catch (err) { if (err instanceof Error || err?.code === 4) throw err; continue; } // Deezer refuse : on passe à la source de secours
    if (!tr.preview || !tr.artist || seenArtists.has(tr.artist.id)) continue;
    const album = { ...tr.album, genre_id: e.g, label: e.l };
    if (!isMusic(tr, album, blocks)) continue; // le filtre a pu évoluer depuis le tirage
    seenArtists.add(tr.artist.id);
    return { track: tr, artist: tr.artist, album };
  }
  return null;
}

// Deezer d'abord (réserve, puis tirage direct). S'il refuse ou ne répond plus, Apple Music prend le relais 10 minutes.
let deezerDownUntil = 0;
async function findTrack() {
  await sharedBlocks;
  if (Date.now() > deezerDownUntil) {
    try { return (await fromPool()) || await drawDirect(); }
    catch { deezerDownUntil = Date.now() + 10 * 60000; }
  }
  return drawApple();
}

// --- Apple Music (source de secours : même catalogue grand public que Deezer ou Spotify, sans clé) ---
// Une requête interroge 200 identifiants tirés au hasard et renvoie souvent des dizaines de chansons.
const APPLE_MAX_ID = 1900000000; // identifiants de titres Apple jusqu'à ~1,9 milliard (mesuré le 23/10/2026)
const APPLE_COUNTRY = 'FR';
const APPLE_EXCLUDED_GENRES = /relax|karaok|enfant|children|kids|jeunesse|livres? audio|audiobook|spoken|parl[ée]|humou?r|comedy|com[ée]die|fitness|instruct|podcast|m[ée]ditation|nature|bruit/i;
const appleQueue = [];

async function refillApple() {
  const ids = Array.from({ length: 200 }, () => Math.floor(Math.random() * APPLE_MAX_ID) + 1);
  const res = await fetch(`https://itunes.apple.com/lookup?country=${APPLE_COUNTRY}&id=${ids.join(',')}`).then(r => r.ok ? r.json() : null).catch(() => null);
  appleQueue.push(...shuffle((res?.results || []).filter(r => r.kind === 'song' && r.previewUrl)));
  return !!res;
}

async function drawApple() {
  for (let tries = 0; tries < 6; tries++) {
    if (!appleQueue.length && !(await refillApple())) await new Promise(r => setTimeout(r, 3000));
    while (appleQueue.length) {
      const t = appleQueue.pop();
      if (APPLE_EXCLUDED_GENRES.test(t.primaryGenreName || '')) continue;
      const artist = { id: 'ap:' + t.artistId, rawId: t.artistId, name: t.artistName, link: t.artistViewUrl || t.trackViewUrl };
      if (seenArtists.has(artist.id)) continue;
      const art = t.artworkUrl100 || '';
      const track = {
        id: 'ap:' + t.trackId, rawId: t.trackId, source: 'apple', title: t.trackName, duration: (t.trackTimeMillis || 0) / 1000,
        preview: t.previewUrl, release_date: t.releaseDate || '', link: t.trackViewUrl, artist,
        album: { id: t.collectionId, title: t.collectionName || '', cover_xl: art.replace('100x100', '1000x1000'), cover_medium: art.replace('100x100', '250x250') },
      };
      const album = { ...track.album, genre_id: null, label: '' };
      if (!isMusic(track, album, blocks)) continue;
      seenArtists.add(artist.id);
      return { track, artist, album };
    }
  }
  throw new Error('rien trouvé');
}

// --- Flux ---
const feed = document.getElementById('feed');
const audio = document.getElementById('audio');
const cards = [];
let current = -1;
let pending = 0;

const SOURCE_NAMES = { deezer: 'Deezer', apple: 'Apple Music', audius: 'Audius' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function placeholder() {
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = '<div class="spin"></div><div class="loading">TIRAGE</div>';
  feed.appendChild(el);
  const c = { el, data: null };
  cards.push(c);
  return c;
}

function fill(c, { track, artist, album }) {
  c.data = { track, artist, album };
  const cover = track.album?.cover_xl || track.album?.cover_big || artist.picture_xl || '';
  const year = (track.release_date || track.album?.release_date || '').slice(0, 4);
  c.el.innerHTML = `
    <div class="bgimg" style="background-image:url('${esc(cover)}')"></div>
    <div class="cover" style="background-image:url('${esc(cover)}')"><div class="disc">II</div></div>
    <div class="meta"><div class="txt">
      <div class="title">${esc(track.title)}</div>
      <div class="artist">${esc(artist.name)}</div>
      <div class="sub">
        ${year && year !== '0000' ? `<span>${year}</span>` : ''}
        ${track.album?.title ? `<span>${esc(track.album.title)}</span>` : ''}
      </div>
    </div>
    <div class="side">
      <button class="report" aria-label="Pas de la musique" title="Pas de la musique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></button>
      <button class="keep" aria-label="Garder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.3 4.5 7 4.5c2 0 3.6 1.1 5 2.8 1.4-1.7 3-2.8 5-2.8 3.7 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="next" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div></div>
    <div class="bar"><i></i></div>
    <a class="src" href="${esc(track.link || artist.link)}" target="_blank" rel="noopener">${SOURCE_NAMES[track.source || 'deezer']}</a>`;
  const keepBtn = c.el.querySelector('.keep');
  keepBtn.classList.toggle('on', kept.some(k => k.trackId === track.id));
  keepBtn.onclick = e => { e.stopPropagation(); toggleKeep(c, keepBtn); };
  c.el.querySelector('.next').onclick = e => { e.stopPropagation(); go(cards.indexOf(c) + 1); };
  c.el.querySelector('.report').onclick = e => { e.stopPropagation(); report(c); };
  c.el.querySelector('.cover').onclick = () => togglePlay();
  if (cards.indexOf(c) === current) play(current);
}

// --- Signalement « pas de la musique » ---
// Il ne bannit personne : il sert seulement à repérer ce que le filtre laisse passer, pour l'améliorer.
async function report(c) {
  if (!c.data || c.reported) return;
  c.reported = true;
  const { track, artist, album } = c.data;
  toast('Signalé');
  go(cards.indexOf(c) + 1);

  // Analyse du catalogue de l'artiste : combien de ses albums ressemblent à des ambiances ou des textes lus.
  let catalogHits = 0;
  if (!track.source) try { // Deezer seulement
    const albums = await dz('/artist/' + artist.id + '/albums?limit=50');
    catalogHits = (albums.data || []).filter(a => SPOKEN.test(a.title) || AMBIENCE.test(a.title)).length;
  } catch {}

  // Envoi pour relecture.
  const clip = (s, n = 400) => String(s ?? '').slice(0, n);
  fetch(SB_URL + '/rest/v1/sillon_reports', {
    method: 'POST',
    headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
    body: JSON.stringify({
      device, source: track.source || 'deezer', track_id: String(track.rawId ?? track.id), title: clip(track.title),
      artist_id: String(artist.rawId ?? artist.id), artist_name: clip(artist.name), album_id: album?.id != null ? String(album.id) : null, album_title: clip(album?.title), label: clip(album?.label), genre_id: album?.genre_id ?? null,
      catalog_hits: Math.min(catalogHits, 100),
    }),
  }).catch(() => {});
}

let toastT;
function toast(text) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1600);
}

function topUp() {
  while (cards.length - Math.max(current, 0) <= AHEAD && pending < 2) {
    const c = placeholder();
    pending++;
    findTrack()
      .then(d => fill(c, d))
      .catch(() => { c.el.innerHTML = '<div class="loading">PAS DE RÉSEAU — DÉFILEZ POUR RÉESSAYER</div>'; c.failed = true; })
      .finally(() => { pending--; topUp(); store.set('seen', [...seenArtists].slice(-20000)); });
  }
}

function play(i) {
  const c = cards[i];
  cards.forEach(x => x.el.classList.remove('paused'));
  if (!c || !c.data) { audio.pause(); return; }
  if (audio.dataset.id !== String(c.data.track.id)) {
    audio.src = c.data.track.preview;
    audio.dataset.id = c.data.track.id;
  }
  audio.play().catch(() => c.el.classList.add('paused'));
}

function togglePlay() {
  const c = cards[current];
  if (!c || !c.data) return;
  if (audio.paused) { audio.play(); c.el.classList.remove('paused'); }
  else { audio.pause(); c.el.classList.add('paused'); }
}

function go(i) {
  if (i < 0 || i >= cards.length) return;
  cards[i].el.scrollIntoView({ behavior: 'smooth' });
}

// Détecte la carte visible
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting && e.intersectionRatio > .6) {
      const i = cards.findIndex(c => c.el === e.target);
      if (i !== current) {
        current = i;
        if (cards[i].failed) { cards[i].failed = false; cards[i].el.innerHTML = '<div class="spin"></div><div class="loading">TIRAGE</div>'; pending++; findTrack().then(d => fill(cards[i], d)).catch(() => {}).finally(() => pending--); }
        play(i);
        topUp();
      }
    }
  }
}, { root: feed, threshold: [.6] });
new MutationObserver(m => m.forEach(r => r.addedNodes.forEach(n => n.nodeType === 1 && n.classList.contains('card') && io.observe(n)))).observe(feed, { childList: true });

audio.addEventListener('timeupdate', () => {
  const bar = cards[current]?.el.querySelector('.bar i');
  if (bar && audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
});
audio.addEventListener('ended', () => { audio.currentTime = 0; audio.play(); });

// --- Gardés ---
const keptEl = document.getElementById('kept');
const keptN = document.getElementById('keptN');
function toggleKeep(c, btn) {
  const { track, artist } = c.data;
  const i = kept.findIndex(k => k.trackId === track.id);
  if (i >= 0) kept.splice(i, 1);
  else kept.unshift({
    trackId: track.id, source: track.source || 'deezer', title: track.title, artist: artist.name, artistLink: artist.link,
    cover: track.album?.cover_medium || artist.picture_medium || '', at: Date.now(),
  });
  btn.classList.toggle('on', i < 0);
  store.set('kept', kept);
  renderKept();
}
function renderKept() {
  keptN.textContent = kept.length ? kept.length : '';
  const ul = keptEl.querySelector('ul');
  if (!kept.length) { ul.innerHTML = '<li class="empty">—</li>'; return; }
  ul.innerHTML = kept.map((k, i) => {
    const q = encodeURIComponent(k.artist + ' ' + k.title);
    return `<li>
      <img src="${esc(k.cover)}" alt="">
      <div class="t"><b>${esc(k.title)}</b><span>${esc(k.artist)}</span>
        <small class="row"><a href="${esc(k.artistLink)}" target="_blank" rel="noopener">${SOURCE_NAMES[k.source || 'deezer']}</a><a href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">Spotify</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a><a href="https://bandcamp.com/search?q=${encodeURIComponent(k.artist)}" target="_blank" rel="noopener">Bandcamp</a></small></div>
      <button class="x" data-i="${i}" aria-label="Retirer">×</button></li>`;
  }).join('');
  ul.querySelectorAll('.x').forEach(b => b.onclick = () => {
    const id = kept[+b.dataset.i].trackId;
    kept.splice(+b.dataset.i, 1); store.set('kept', kept); renderKept();
    cards.forEach(c => c.data?.track.id === id && c.el.querySelector('.keep')?.classList.remove('on'));
  });
}
document.getElementById('keptBtn').onclick = () => {
  const open = keptEl.classList.toggle('open');
  document.getElementById('keptBtn').classList.toggle('on', open);
};

// --- Clavier ---
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(current + 1); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(current - 1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'l' || e.key === 'g') { const b = cards[current]?.el.querySelector('.keep'); b && b.click(); }
});

// --- Démarrage (le navigateur exige un geste pour lancer le son) ---
document.getElementById('go').onclick = () => {
  document.getElementById('start').remove();
  audio.play().catch(() => {});
  if (cards[current]?.data) play(current);
};
renderKept();
topUp();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
