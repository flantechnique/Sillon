<style>
@font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/fraunces.woff2) format('woff2'); }
@font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 400 800; font-display: swap; src: url(fonts/fraunces-italic.woff2) format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/dmsans.woff2) format('woff2'); }

:root {
  --paper: #f4e9d4;
  --paper-2: #ead9bb;
  --ink: #241b14;
  --ink-soft: #6b5a4a;
  --tomato: #e4572e;
  --mustard: #e9b44c;
  --teal: #2a9d8f;
  --line: rgba(36, 27, 20, .16);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sticker: 2px 2px 0 var(--ink);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
/* Grain papier par-dessus tout, sans gêner les clics */
body::after { content: ''; position: fixed; inset: 0; z-index: 40; pointer-events: none; background: url(grain.png); opacity: .55; mix-blend-mode: multiply; }

#feed { height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
#feed::-webkit-scrollbar { display: none; }

/* --- Carte : une couleur de pochette par titre --- */
.card {
  --bg: var(--mustard); --fg: var(--ink); --ac: var(--tomato);
  --s: min(56vw, 42vh, 330px);
  position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(64px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  overflow: hidden; background: var(--bg); color: var(--fg);
}
.card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 35%, rgba(255,255,255,.22), transparent 60%), radial-gradient(140% 100% at 50% 100%, rgba(0,0,0,.18), transparent 55%); pointer-events: none; }
.card > * { position: relative; }

.stage { position: relative; width: calc(var(--s) * 1.38); height: var(--s); flex: none; }
.cover {
  position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); z-index: 2; cursor: pointer;
  border-radius: 3px; background: var(--paper-2) center/cover;
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 0 0 1px rgba(0,0,0,.12) inset, 6px 10px 0 rgba(0,0,0,.18), 0 22px 40px rgba(0,0,0,.28);
}
.cover::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, rgba(255,255,255,.18), transparent 35%, transparent 70%, rgba(0,0,0,.12)); }
.playIcon { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s; z-index: 1; }
.playIcon i { width: 64px; height: 64px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); box-shadow: var(--sticker); display: grid; place-items: center; color: var(--ink); }
.playIcon svg { width: 26px; height: 26px; margin-left: 4px; }
.card.paused .playIcon { opacity: 1; }

/* Le disque sort de la pochette quand la carte est à l'écran */
.disc { position: absolute; top: 3%; left: 3%; width: 94%; aspect-ratio: 1; height: auto; width: calc(var(--s) * .94); z-index: 1; transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
.card.current .disc { transform: translateX(calc(var(--s) * .46)); }
.vinyl {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.06) 31.5% 32%, transparent 32.5%),
    repeating-radial-gradient(circle, #1c1612 0 1.6px, #2b231d 1.6px 2.4px),
    #1c1612;
  box-shadow: 0 10px 24px rgba(0,0,0,.35);
  animation: spin 1.8s linear infinite; animation-play-state: paused;
}
.card.spinning .vinyl { animation-play-state: running; }
.sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; background: conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.13) 12%, transparent 17% 52%, rgba(255,255,255,.1) 58%, transparent 63%); }
.label { position: absolute; inset: 32%; border-radius: 50%; background: var(--ac) center/cover; box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
.label::after { content: ''; position: absolute; inset: 46%; border-radius: 50%; background: var(--paper); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Le sillon : la progression de l'extrait se dessine autour du disque */
.ring { position: absolute; inset: -5%; width: 110%; height: 110%; transform: rotate(-90deg); pointer-events: none; }
.ring circle { fill: none; stroke-width: 1.6; }
.ring .track { stroke: var(--fg); opacity: .14; }
.ring .done { stroke: var(--ac); stroke-linecap: round; stroke-dasharray: 304.7; stroke-dashoffset: 304.7; transition: stroke-dashoffset .25s linear; }

/* Bras de lecture : se pose quand ça joue */
.arm { position: absolute; inset: -6% -14% auto auto; width: 62%; aspect-ratio: 1; z-index: 3; pointer-events: none; transform-origin: 84% 12%; transform: rotate(-26deg); transition: transform .6s cubic-bezier(.3, 1.4, .5, 1); filter: drop-shadow(3px 4px 0 rgba(0,0,0,.18)); }
.card.spinning .arm { transform: rotate(0deg); }

.meta { width: min(100%, 460px); margin-top: 26px; display: flex; gap: 14px; align-items: flex-start; }
.meta .txt { flex: 1; min-width: 0; }
.title { font-family: var(--serif); font-size: clamp(22px, 3.6vh, 32px); font-weight: 650; line-height: 1.08; letter-spacing: -.01em; font-variation-settings: 'SOFT' 100, 'opsz' 72; overflow-wrap: anywhere; }
.artist { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-top: 8px; color: var(--fg); opacity: .85; }
.sub { font-family: var(--serif); font-style: italic; font-size: 14px; margin-top: 6px; opacity: .7; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.side { display: flex; gap: 10px; flex: none; }
.side button { width: 50px; height: 50px; border-radius: 50%; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: var(--sticker); display: grid; place-items: center; transition: transform .12s, box-shadow .12s, background .15s; }
.side button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.side svg { width: 22px; height: 22px; }
.side .keep.on { background: var(--tomato); color: var(--paper); }
.side .report { background: transparent; border-color: currentColor; color: var(--fg); box-shadow: none; opacity: .7; width: 44px; height: 44px; }
.src { margin-top: 16px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; opacity: .55; }
.src:hover { opacity: 1; }
.apple { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.apple a { display: block; padding: 4px; line-height: 0; } /* marge libre autour du badge (1/10 de sa hauteur) */
.apple img { height: 35px; width: auto; }
.apple small { font-size: 10px; letter-spacing: .04em; opacity: .65; }
@media (max-width: 560px) {
  .meta { flex-direction: column; gap: 14px; }
  .side { width: 100%; justify-content: flex-end; align-items: center; }
  .side .report { margin-right: auto; }
}

/* Chargement : un disque vierge qui tourne */
.loader { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.loader .vinyl { position: relative; width: 120px; height: 120px; animation-play-state: running; }
.loader .label { background: var(--paper); }
.loading { font-family: var(--serif); font-style: italic; font-size: 18px; opacity: .75; text-align: center; max-width: 280px; }

/* --- En-tête : des étiquettes collées --- */
header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 14px 12px; z-index: 16; pointer-events: none; }
header > * { pointer-events: auto; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 20px; background: var(--paper); border: 2px solid var(--ink); box-shadow: var(--sticker); border-radius: 99px; padding: 3px 14px 4px 5px; }
.logo i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, var(--paper) 0 9%, var(--tomato) 10% 33%, #1c1612 34%); }
.hbtns { display: flex; gap: 8px; }
.pill { font-size: 13px; font-weight: 700; padding: 7px 13px; border-radius: 99px; background: var(--paper); border: 2px solid var(--ink); box-shadow: var(--sticker); }
.pill.on { background: var(--ink); color: var(--paper); }
#keptN:not(:empty) { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 4px; padding: 0 4px; border-radius: 99px; background: var(--tomato); color: var(--paper); font-size: 11px; }

/* --- Accueil : la platine --- */
#start { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; transition: opacity .45s .35s, transform .45s .35s; }
#start.drop { opacity: 0; transform: scale(1.04); pointer-events: none; }
.deck { position: relative; width: min(74vw, 46vh, 360px); aspect-ratio: 1.12; border-radius: 18px; background: var(--teal); border: 2px solid var(--ink); box-shadow: 5px 6px 0 var(--ink); }
.deck::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 7px); }
.deck .platter { position: absolute; left: 7%; top: 8%; width: 76%; aspect-ratio: 1; border-radius: 50%; background: #3a2e25; box-shadow: 0 0 0 4px rgba(0,0,0,.2); }
.deck .vinyl { inset: 3%; }
.deck .label { background: var(--tomato); display: grid; place-items: center; }
.deck .label span { font-family: var(--serif); font-style: italic; font-weight: 700; color: var(--paper); font-size: clamp(12px, 3.6vw, 18px); }
.deck .label::after { display: none; }
.deck .arm { inset: 2% 1% auto auto; width: 58%; }
#start.drop .vinyl { animation-play-state: running; }
#start.drop .arm { transform: rotate(0deg); }
#start h1 { font-family: var(--serif); font-style: italic; font-weight: 750; font-size: clamp(48px, 13vw, 76px); line-height: .9; letter-spacing: -.02em; font-variation-settings: 'SOFT' 100, 'opsz' 144; color: var(--tomato); text-shadow: 3px 3px 0 var(--ink); margin-top: 8px; }
#start p em { color: var(--ink); font-weight: 600; }
#start p { font-family: var(--serif); font-size: 17px; line-height: 1.45; color: var(--ink-soft); max-width: 330px; }
#go { font-weight: 700; font-size: 16px; padding: 14px 26px; border-radius: 99px; background: var(--mustard); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
#go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

/* --- Gardés / récents : un bac à disques --- */
#kept { position: fixed; inset: 0; z-index: 15; background: var(--paper); overflow-y: auto; padding: calc(72px + env(safe-area-inset-top)) 16px 40px; display: none; }
#kept.open { display: block; }
#kept ul { list-style: none; max-width: 560px; margin: 0 auto; }
#kept li { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1.5px dashed var(--line); }
#kept img { width: 58px; height: 58px; border-radius: 3px; object-fit: cover; flex: none; background: var(--paper-2); box-shadow: 3px 3px 0 rgba(36,27,20,.2); }
#kept .t { flex: 1; min-width: 0; }
#kept .t b { display: block; font-family: var(--serif); font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kept .t span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tomato); }
#kept .t small { display: block; font-size: 12px; margin-top: 3px; }
#kept .row a { color: var(--ink-soft); margin-right: 10px; }
#kept .x { color: var(--ink-soft); font-size: 22px; padding: 8px; }
#kept .row .thx { color: var(--tomato); font-weight: 700; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
#kept .h { color: var(--ink-soft); padding: 8px; display: grid; }
#kept .h svg { width: 22px; height: 22px; }
#kept .h.on { color: var(--tomato); }
#kept .empty { justify-content: center; border: 0; margin-top: 26vh; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--ink-soft); }
.panelLinks { display: flex; justify-content: center; gap: 22px; margin-top: 30px; flex-wrap: wrap; }
.syncLink { font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); box-shadow: var(--sticker); }

/* --- Fenêtres : des fiches cartonnées --- */
.sheet, #sync { position: fixed; inset: 0; z-index: 25; background: rgba(36, 27, 20, .55); display: none; align-items: center; justify-content: center; padding: 16px; }
.sheet.open, #sync.open { display: flex; }
.sheet .box, #sync .box { position: relative; width: min(100%, 420px); max-height: calc(100% - 32px); overflow-y: auto; background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); border-radius: 16px; padding: 26px 20px 20px; }
#sync .box { width: min(100%, 360px); text-align: center; }
.sheet .x, #sync .x { position: absolute; top: 6px; right: 10px; font-size: 26px; color: var(--ink-soft); padding: 6px; }
.sheet h2 { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.1; padding-right: 30px; }
.hint { margin-top: 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
.seg { display: inline-flex; margin-top: 14px; border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
.seg button { font-size: 12px; font-weight: 700; padding: 6px 14px; }
.seg button.on { background: var(--ink); color: var(--paper); }
#exportList { margin: 16px 0 0 22px; font-size: 14px; line-height: 1.6; max-height: 32vh; overflow-y: auto; }
#exportList span { font-weight: 700; color: var(--tomato); }
.sheet .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.sheet .actions button { flex: 1; padding: 12px; border-radius: 99px; border: 2px solid var(--ink); background: var(--paper); box-shadow: var(--sticker); font-size: 14px; font-weight: 700; }
.sheet .actions .primary { background: var(--mustard); }
.sheet .backup { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1.5px dashed var(--line); font-size: 12px; color: var(--ink-soft); }
.sheet .backup button, .sheet .backup label { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink-soft); }
#qr { width: 196px; height: 196px; margin: 0 auto; padding: 8px; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; }
#qr img, #qr canvas { display: block; width: 176px !important; height: 176px !important; }
#syncCode { margin-top: 16px; font: 700 18px/1.2 ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: .06em; color: var(--tomato); user-select: all; }
#syncStatus { margin-top: 8px; font-size: 12px; color: var(--ink-soft); min-height: 1em; }
#syncForm { display: flex; gap: 8px; margin-top: 18px; }
#syncForm input { flex: 1; min-width: 0; background: #fffaf0; color: var(--ink); border: 2px solid var(--ink); border-radius: 99px; padding: 10px 14px; font: inherit; font-size: 14px; }
#syncForm button { padding: 10px 16px; border-radius: 99px; background: var(--mustard); border: 2px solid var(--ink); box-shadow: var(--sticker); font-weight: 700; font-size: 14px; }

.logo { cursor: pointer; font: inherit; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 20px; color: var(--ink); }
.aboutText { margin-top: 12px; font-size: 14px; line-height: 1.55; }
.aboutText p + p { margin-top: 10px; }
.optout { display: flex; gap: 10px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1.5px dashed var(--line); font-size: 14px; font-weight: 700; cursor: pointer; }
.optout input { width: 20px; height: 20px; accent-color: var(--tomato); }
#about .hint a { color: var(--ink-soft); }
#about .contact a[href^='mailto'] { color: var(--tomato); font-weight: 700; }
#toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px) rotate(-2deg); opacity: 0; transition: .25s; z-index: 30; background: var(--paper); border: 2px solid var(--ink); box-shadow: var(--sticker); padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 700; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-2deg); }


/* --- Écoute à l'aveugle --- */
.pill.icon { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
.pill.icon svg { width: 20px; height: 20px; }
.reveal { display: none; align-items: center; gap: 12px; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg); }
.reveal b { font-family: var(--serif); font-style: italic; font-size: 54px; line-height: .9; letter-spacing: 0; text-transform: none; }
.reveal span { border-bottom: 2px solid currentColor; padding-bottom: 2px; }
.card.blind .reveal { display: inline-flex; }
.card.blind .title, .card.blind .artist, .card.blind .sub, .card.blind .src { display: none; }
.card.blind .cover, .card.blind .label { background-image: none !important; }
.card.blind .cover { background: repeating-linear-gradient(135deg, var(--ac) 0 14px, color-mix(in srgb, var(--ac) 82%, #000) 14px 28px) !important; }
.card.blind .cover::before { content: '?'; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-weight: 750; font-size: calc(var(--s) * .55); color: var(--paper); text-shadow: 4px 4px 0 var(--ink); }
.card.blind .label { background: var(--paper) !important; }
@media (max-width: 400px) {
  .logo { font-size: 17px; padding-right: 10px; }
  .hbtns { gap: 6px; }
  .pill { padding: 7px 10px; font-size: 12px; }
  .pill.icon { width: 34px; height: 34px; padding: 0; }
}

/* --- Partage : lien ou image pour une story --- */
#share .box { text-align: center; }
#share h2 { padding: 0 24px; font-size: 20px; }
#sharePreview { display: block; height: min(42vh, 360px); aspect-ratio: 9 / 16; margin: 16px auto 0; border-radius: 10px; border: 2px solid var(--ink); box-shadow: var(--sticker); background: var(--paper-2); object-fit: cover; }
#share .actions button:disabled { opacity: .45; }

/* --- Devinette du jour --- */
.guess { display: none; margin-bottom: 10px; }
.card.blind.daily .guess { display: block; }
.guess p { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 8px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 99px; border: 2px solid currentColor; color: var(--fg); }
.chips button.on { background: var(--fg); color: var(--bg); }
.gres { display: none; margin-top: 12px; font-size: 13px; line-height: 1.5; }
.card.daily.played .gres { display: block; }
.gres b { font-weight: 700; }
.gres button { margin-top: 8px; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 99px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: var(--sticker); }
#shareNote { display: block; width: 100%; margin-top: 14px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 99px; background: #fffaf0; color: var(--ink); font: inherit; font-size: 14px; }
#start .note { font-family: var(--serif); font-style: italic; color: var(--ink); }
#platineCode { margin: 16px 0 4px; text-align: center; font: 700 26px/1.2 ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: .12em; color: var(--tomato); }
.carnetStats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.carnetStats div { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; background: #fffaf0; }
.carnetStats b { display: block; font: 700 24px/1.1 var(--serif); }
.carnetStats span { font-size: 12px; color: var(--ink-soft); }
#carnetBody h3 { font: 700 13px var(--sans); letter-spacing: .08em; text-transform: uppercase; margin: 16px 0 8px; }
#carnetBody .chips button { cursor: default; color: var(--ink); border-color: var(--ink); font-size: 12px; padding: 4px 9px; }
#carnetBody .chips button:not(.on) { border-style: dashed; opacity: .55; }

// --- Deezer (JSONP, pas de CORS sur l'API) ---
let cbN = 0;
function dz(path, timeout = 6000) {
  return new Promise((resolve, reject) => {
    const name = '__dz' + (cbN++);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout);
    function cleanup() { clearTimeout(t); delete window[name]; s.remove(); }
    window[name] = data => { cleanup(); data && data.error ? reject(data.error) : resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('net')); };
    s.src = 'https://api.deezer.com' + path + (path.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + name;
    document.head.appendChild(s);
  });
}

  let a = 0x9e3779b9;
  for (const ch of str) a = Math.imul(a ^ ch.charCodeAt(0), 2654435761);
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

  if (n === undefined) return;
  const rows = await fetch(`pool/${n}.json?v=${encodeURIComponent(pool.version)}`).then(r => r.json()).catch(() => []);
  pool.queue.push(...shuffle(rows));
}

async function fromPool() {
  for (let tries = 0; tries < 40; tries++) {
    if (!pool.queue.length) {
      await (pool.loading ||= loadChunk().finally(() => { pool.loading = null; }));
      if (!pool.queue.length) return null; // réserve épuisée ou absente
    }
    const e = pool.queue.pop(); // { i: titre, a: artiste, g: genre, l: label }
    if (heard(e.a) || blocks.artists.has(String(e.a)) || blocks.labels.has(normLabel(e.l))) continue;
    let tr;
    try { tr = await dz('/track/' + e.i); }
    catch (err) { if (err instanceof Error || err?.code === 4) throw err; continue; } // Deezer refuse : on passe à la source de secours
    if (!tr.preview || !tr.artist || heard(tr.artist.id)) continue;
    const album = { ...tr.album, genre_id: e.g, label: e.l };
    if (!isMusic(tr, album, blocks)) continue; // le filtre a pu évoluer depuis le tirage
    seenArtists.add(tr.artist.id);
    platineArtists.add(tr.artist.id);
    return { track: tr, artist: tr.artist, album };
  }
  return null;
}

// Deezer d'abord (réserve tirée chaque nuit). S'il refuse ou ne répond plus, Apple Music prend le relais 10 minutes.
let deezerDownUntil = 0;
async function findTrack() {
  await sharedBlocks;
  if (Date.now() > deezerDownUntil) {
    try { const d = await fromPool(); if (d) return d; } // réserve épuisée : Apple Music, sans marquer Deezer en panne
    catch { deezerDownUntil = Date.now() + 10 * 60000; }
  }
  return drawApple();
}

// --- Apple Music (source de secours : même catalogue grand public que Deezer ou Spotify, sans clé) ---
// Une requête interroge 200 identifiants tirés au hasard et renvoie souvent des dizaines de chansons.
const APPLE_MAX_ID = 1900000000; // identifiants de titres Apple jusqu'à ~1,9 milliard (mesuré le 23/10/2026)
const APPLE_COUNTRY = 'FR';
const APPLE_EXCLUDED_GENRES = /relax|karaok|enfant|children|kids|jeunesse|livres? audio|audiobook|spoken|parl[ée]|humou?r|comedy|com[ée]die|fitness|instruct|podcast|m[ée]ditation|nature|bruit/i;
const appleQueue = [];

async function refillApple() {
  const ids = Array.from({ length: 200 }, () => Math.floor(Math.random() * APPLE_MAX_ID) + 1);
  const res = await fetch(`https://itunes.apple.com/lookup?country=${APPLE_COUNTRY}&id=${ids.join(',')}`).then(r => r.ok ? r.json() : null).catch(() => null);
  appleQueue.push(...shuffle((res?.results || []).filter(r => r.kind === 'song' && r.previewUrl)));
  return !!res;
}

// Résultat iTunes -> même forme qu'un titre Deezer.
function appleEntry(t) {
  const artist = { id: 'ap:' + t.artistId, rawId: t.artistId, name: t.artistName, link: t.artistViewUrl || t.trackViewUrl };
  const art = t.artworkUrl100 || '';
  const track = {
    id: 'ap:' + t.trackId, rawId: t.trackId, source: 'apple', title: t.trackName, duration: (t.trackTimeMillis || 0) / 1000,
    preview: t.previewUrl, release_date: t.releaseDate || '', link: t.trackViewUrl, artist,
    album: { id: t.collectionId, title: t.collectionName || '', cover_xl: art.replace('100x100', '1000x1000'), cover_medium: art.replace('100x100', '250x250') },
  };
  return { track, artist, album: { ...track.album, genre_id: null, label: '' } };
}

async function drawApple() {
  for (let tries = 0; tries < 6; tries++) {
    if (!appleQueue.length && !(await refillApple())) await new Promise(r => setTimeout(r, 3000));
    while (appleQueue.length) {
      const t = appleQueue.pop();
      if (APPLE_EXCLUDED_GENRES.test(t.primaryGenreName || '')) continue;
      const { track, artist, album } = appleEntry(t);
      if (seenArtists.has(artist.id)) continue;
      if (!isMusic(track, album, blocks)) continue;
      seenArtists.add(artist.id);
      return { track, artist, album };
    }
  }
  throw new Error('rien trouvé');
}

// --- Flux ---
const feed = document.getElementById('feed');
const audio = document.getElementById('audio');
const cards = [];
let current = -1;
let pending = 0;

const ARM_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><line x1="84" y1="12" x2="47" y2="80" stroke="#241b14" stroke-width="7.5" stroke-linecap="round"/><line x1="84" y1="12" x2="47" y2="80" stroke="#efe2c8" stroke-width="4" stroke-linecap="round"/><path d="M41 76 l12 6 -5 11 -12 -6z" fill="#efe2c8" stroke="#241b14" stroke-width="2.2" stroke-linejoin="round"/><circle cx="84" cy="12" r="10" fill="#efe2c8" stroke="#241b14" stroke-width="2.4"/><circle cx="84" cy="12" r="3.2" fill="#241b14"/></svg>';
// Couleurs de pochettes rétro : fond, texte, accent. Chaque carte prend la suivante.
const PALETTES = [
  ['#e9b44c', '#241b14', '#e4572e'], ['#e4572e', '#fff4e0', '#f6c453'], ['#2a9d8f', '#fff4e0', '#f6c453'],
  ['#7b4b6e', '#fff4e0', '#f2a65a'], ['#7fb7dc', '#241b14', '#e4572e'], ['#a3ad62', '#241b14', '#c8452d'],

let paletteN = Math.floor(Math.random() * PALETTES.length);
const RING = 2 * Math.PI * 48.5;
const LOADER = '<div class="loader"><div class="vinyl"><div class="label"></div></div><div class="loading">' + t('digging') + '</div></div>';
const SOURCE_NAMES = { deezer: 'Deezer', apple: 'Apple Music', audius: 'Audius' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function placeholder() {
  const el = document.createElement('section');

  const [bg, fg, ac] = PALETTES[paletteN++ % PALETTES.length];

function fill(c, { track, artist, album }) {

        <div class="arm">${ARM_SVG}</div>
      </div>
      <div class="cover" role="button" tabindex="0" aria-label="${t('playPause')}" style="background-image:url('${esc(cover)}')"><div class="playIcon" aria-hidden="true"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg></i></div></div>
    </div>

      <button class="share" aria-label="${t('share')}" title="${t('share')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button class="keep" aria-label="${t('keep')}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.2 3.3 4.5 7 4.5c2 0 3.6 1.1 5 2.8 1.4-1.7 3-2.8 5-2.8 3.7 0 6 3.7 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="next" aria-label="${t('next')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div></div>
    ${track.source === 'apple'
      // Règles Apple : badge officiel non modifié, lien direct vers le titre, mention « provided courtesy of iTunes ».
      ? `<div class="apple"><a href="${esc(track.link)}" target="_blank" rel="noopener"><img src="badges/listen-on-apple-music.svg" alt="Listen on Apple Music" width="120" height="35"></a><small>Provided courtesy of iTunes</small></div>`
      : `<a class="src" href="${esc(track.link || artist.link)}" target="_blank" rel="noopener">${t('preview')} · ${SOURCE_NAMES[track.source || 'deezer']}</a>`}`;
  c.el.classList.toggle('current', cards.indexOf(c) === current);
  c.el.classList.toggle('daily', !!c.daily);
  if (c.daily && guesses()[daily.day]) { c.revealed = true; showResult(c); } // déjà joué aujourd'hui
  c.el.classList.toggle('blind', !!((blindMode || c.daily) && !c.revealed)); // toggle(…, undefined) inverserait la classe
  labelCard(c);
  c.el.querySelectorAll('.chips button').forEach(b => b.onclick = e => { e.stopPropagation(); pickGuess(c, b); });
  c.el.querySelector('.reveal').onclick = e => { e.stopPropagation(); reveal(c); };
  const keepBtn = c.el.querySelector('.keep');
  keepBtn.classList.toggle('on', kept.some(k => k.trackId === track.id));
  keepBtn.onclick = e => { e.stopPropagation(); reveal(c); toggleKept(entryOf(c)); };
  c.el.querySelector('.next').onclick = e => { e.stopPropagation(); go(cards.indexOf(c) + 1); };
  c.el.querySelector('.report').onclick = e => { e.stopPropagation(); report(c); };
  c.el.querySelector('.share').onclick = e => { e.stopPropagation(); shareTrack(c); };
  const coverEl = c.el.querySelector('.cover');
  coverEl.onclick = () => togglePlay();
  coverEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); togglePlay(); } };

  else if (cards.indexOf(c) === current + 1) preloadNext();

// Nom de la carte pour les lecteurs d'écran (rien de révélé en écoute à l'aveugle).
function labelCard(c) {
  if (!c.data) return;
  c.el.setAttribute('aria-label', c.el.classList.contains('blind') ? t('hidden') : t('cardLabel', c.data.track.title, c.data.artist.name));
}

// --- Signalement « pas de la musique » ---
// Il ne bannit personne : il sert seulement à repérer ce que le filtre laisse passer, pour l'améliorer.
async function report(c) {
  if (!c.data || c.reported) return;
  c.reported = true;
  const { track, artist, album } = c.data;
  toast(t('reported'));
  bump('reports');
  go(cards.indexOf(c) + 1);

  // Analyse du catalogue de l'artiste : combien de ses albums ressemblent à des ambiances ou des textes lus.
  let catalogHits = 0;
  if (!track.source) try { // Deezer seulement
    const albums = await dz('/artist/' + artist.id + '/albums?limit=50');
    catalogHits = (albums.data || []).filter(a => SPOKEN.test(a.title) || AMBIENCE.test(a.title)).length;
  } catch {}

  // Envoi pour relecture.
  const clip = (s, n = 400) => String(s ?? '').slice(0, n);
  fetch(SB_URL + '/rest/v1/sillon_reports', {
    method: 'POST',
    headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
    body: JSON.stringify({
      device, source: track.source || 'deezer', track_id: String(track.rawId ?? track.id), title: clip(track.title),
      artist_id: String(artist.rawId ?? artist.id), artist_name: clip(artist.name), album_id: album?.id != null ? String(album.id) : null, album_title: clip(album?.title), label: clip(album?.label), genre_id: album?.genre_id ?? null,
      catalog_hits: Math.min(catalogHits, 100),
    }),
  }).catch(() => {});
}

let toastT;
function toast(text) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1600);
}

function topUp() {
  while (cards.length - Math.max(current, 0) <= AHEAD && pending < (platine ? 1 : 2)) { // en platine, un tirage à la fois pour garder l'ordre
    const c = placeholder();
    pending++;
    findTrack()
      .then(d => fill(c, d))
      .catch(() => { c.el.innerHTML = `<div class="loader"><div class="loading">${t('offline')}</div></div>`; c.failed = true; })
      .finally(() => { pending--; topUp(); store.set('seen', [...seenArtists].slice(-20000)); });
  }
}

// Second lecteur muet : télécharge l'extrait suivant à l'avance pour enchaîner sans blanc.
const preloader = new Audio();
preloader.preload = 'auto';
preloader.muted = true;
function preloadNext() {
  const n = cards[current + 1];
  if (!n?.data || preloader.dataset.id === String(n.data.track.id)) return;
  preloader.src = n.data.track.preview;
  preloader.dataset.id = n.data.track.id;
  preloader.load();
}

function play(i) {
  const c = cards[i];
  cards.forEach(x => x.el.classList.remove('paused'));
  if (!c || !c.data) { audio.pause(); return; }
  if (audio.dataset.id !== String(c.data.track.id)) {
    audio.src = c.data.track.preview;
    audio.dataset.id = c.data.track.id;
    remember(c);
    bump('plays');
    if (c.el.classList.contains('blind')) bump('blind_plays');
    setSession(c);
  }
  audio.play().catch(() => c.el.classList.add('paused'));
  preloadNext();
}

function togglePlay(force) {
  const c = cards[current];
  if (!c || !c.data) return;
  const shouldPlay = force ?? audio.paused;
  if (shouldPlay) { audio.play(); c.el.classList.remove('paused'); }
  else { audio.pause(); c.el.classList.add('paused'); }
}

// Change de titre sans attendre le défilement : marche aussi écran verrouillé (boutons des écouteurs).
function setCurrent(i) {
  if (i === current || !cards[i]) return;
  current = i;
  cards.forEach((x, j) => x.el.classList.toggle('current', j === i));
  syncSpin();
  const c = cards[i];
  if (c.failed) {
    c.failed = false;
    c.el.innerHTML = LOADER;
    pending++;
    findTrack().then(d => fill(c, d)).catch(() => {}).finally(() => pending--);
  }
  play(i);
  topUp();
}

function go(i) {
  if (i < 0 || i >= cards.length) return;
  setCurrent(i);
  cards[i].el.scrollIntoView({ behavior: document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

// Détecte la carte visible
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting && e.intersectionRatio > .6) setCurrent(cards.findIndex(c => c.el === e.target));
  }
}, { root: feed, threshold: [.6] });
new MutationObserver(m => m.forEach(r => r.addedNodes.forEach(n => n.nodeType === 1 && n.classList.contains('card') && io.observe(n)))).observe(feed, { childList: true });

// Le sillon se trace autour du disque au fil de l'extrait.
audio.addEventListener('timeupdate', () => {
  const ring = cards[current]?.el.querySelector('.ring .done');
  if (ring && audio.duration) ring.style.strokeDashoffset = RING * (1 - audio.currentTime / audio.duration);
});
function syncSpin() {
  cards.forEach((c, i) => c.el.classList.toggle('spinning', i === current && !audio.paused && !!c.data));
}
['play', 'playing', 'pause', 'ended', 'emptied'].forEach(ev => audio.addEventListener(ev, syncSpin));
// Fin de l'extrait : on enchaîne, comme une radio (utile écran verrouillé).
audio.addEventListener('ended', () => { bump('completes'); go(current + 1); });

// --- Écran verrouillé, écouteurs, montre : titre, pochette et commandes ---
function setSession(c) {
  if (!('mediaSession' in navigator)) return;
  const { track, artist } = c.data;
  if (c.el.classList.contains('blind')) { // à l'aveugle : rien sur l'écran verrouillé non plus
    navigator.mediaSession.metadata = new MediaMetadata({ title: '?', artist: 'Sillon', album: '', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
    return;
  }
  const cover = track.album?.cover_xl || track.album?.cover_medium || '';
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title, artist: artist.name, album: track.album?.title || '',
    artwork: cover ? [{ src: cover, sizes: '1000x1000', type: 'image/jpeg' }] : [],
  });
}

// --- Écoute à l'aveugle : pochette, titre et artiste cachés jusqu'à ce qu'on les révèle ou qu'on garde le titre ---
let blindMode = store.get('blind', false);
function reveal(c) {
  if (!c.data || c.revealed) return;
  c.revealed = true;
  const wasBlind = c.el.classList.contains('blind');
  c.el.classList.remove('blind');
  labelCard(c);
  if (wasBlind && cards.indexOf(c) === current) setSession(c);
  if (c.daily) saveGuess(c);
}

// --- Devinette du jour : genre et décennie du titre du jour, à deviner avant de révéler ---
// Les choix proposés dépendent seulement du jour : tout le monde a les mêmes.
let daily = null; // { day, n, i, g, y }, voir tools/pick-daily.js
const guesses = () => store.get('guesses', {});
const parisDay = (offset = 0) => new Date(Date.now() - offset * 86400000).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' });

function guessOptions() {
  const r = seeded('devinette:' + daily.day);
  const others = shuffle(Object.keys(GENRES).map(Number).filter(g => g !== daily.g), r).slice(0, 3);
  const dec = Math.floor(daily.y / 10) * 10;
  const near = shuffle([-30, -20, -10, 10, 20, 30].map(k => dec + k).filter(d => d >= 1930 && d <= 2020), r).slice(0, 3);
  return { genres: shuffle([daily.g, ...others], r), decades: [dec, ...near].sort((a, b) => a - b), dec };
}

function guessHtml() {
  const o = guessOptions();
  return `<div class="guess">
    <p>${t('genreQ')}</p><div class="chips" data-k="g">${o.genres.map(g => `<button data-v="${g}">${esc(GENRES[g])}</button>`).join('')}</div>
    <p>${t('decadeQ')}</p><div class="chips" data-k="d">${o.decades.map(d => `<button data-v="${d}">${t('decade', d)}</button>`).join('')}</div>
  </div>`;
}

function pickGuess(c, b) {
  const k = b.parentElement.dataset.k;
  (c.guess ||= {})[k] = +b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  if (c.guess.g != null && c.guess.d != null) setTimeout(() => reveal(c), 450); // les deux choisis : on révèle
}

function saveGuess(c) {
  const all = guesses();
  if (!all[daily.day]) {
    const g = c.guess || {};
    all[daily.day] = { g: g.g == null ? null : g.g === daily.g, d: g.d == null ? null : g.d === guessOptions().dec };
    store.set('guesses', all);
    if (g.g != null || g.d != null) bump('guesses');
    scheduleSync();
  }
  showResult(c);
}

// Série : jours joués d'affilée, un jour manqué toléré. Visible seulement par soi.
function streak() {
  const all = guesses();
  let n = 0, gap = 0;
  for (let i = 0; i < 1000; i++) {
    if (all[parisDay(i)]) { n++; gap = 0; } else if (++gap > 1) break;
  }
  return n;
}

function showResult(c) {
  const res = guesses()[daily.day];
  const box = c.el.querySelector('.gres');
  if (!res || !box) return;
  c.el.classList.add('played');
  const word = ok => ok == null ? t('skipped') : ok ? t('right') : t('wrong');
  box.innerHTML = `${t('genreQ').replace(/ ?\?$/, '')} : <b>${esc(GENRES[daily.g])}</b>, ${word(res.g)}<br>
    ${t('decadeQ').replace(/ ?\?$/, '')} : <b>${t('decade', guessOptions().dec)}</b>, ${word(res.d)}<br>${t('streak', streak())}<br>
    <button class="shareRes">${t('shareResult')}</button>`;
  box.querySelector('.shareRes').onclick = async e => {
    e.stopPropagation();
    const sq = ok => ok == null ? '–' : ok ? '■' : '□';
    const text = t('resultText', daily.n, sq(res.g), sq(res.d), t('streak', streak())) + `\n${location.origin}${location.pathname}?jour`;
    bump('guess_shares');
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (err) { if (err.name === 'AbortError') return; } }
    toast(await copyText(text) ? t('resultCopied') : t('copyFailed'));
  };
}
function setBlind(on) {
  blindMode = on;
  store.set('blind', on);
  const btn = document.getElementById('blindBtn');
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on);
  cards.forEach(c => { c.el.classList.toggle('blind', !!((on || c.daily) && c.data && !c.revealed)); labelCard(c); });
  if (cards[current]?.data) setSession(cards[current]);
}
document.getElementById('blindBtn').onclick = () => { setBlind(!blindMode); toast(t(blindMode ? 'blindOn' : 'blindOff')); };
setBlind(blindMode);
if ('mediaSession' in navigator) {
  const actions = { play: () => togglePlay(true), pause: () => togglePlay(false), nexttrack: () => go(current + 1), previoustrack: () => go(current - 1) };
  for (const [k, fn] of Object.entries(actions)) try { navigator.mediaSession.setActionHandler(k, fn); } catch {}
}

// --- Gardés et récents (le cœur ne sert qu'à retrouver un titre : il n'influence jamais le tirage) ---
let recent = store.get('recent', []);
const panelEl = document.getElementById('kept');
const keptN = document.getElementById('keptN');
let panelMode = null; // 'kept' | 'recent' | null

function entryOf(c) {
  const { track, artist } = c.data;
  return {
    trackId: track.id, source: track.source || 'deezer', title: track.title, artist: artist.name, artistLink: artist.link,

    g: GENRES[c.data.album?.genre_id] ? c.data.album.genre_id : undefined, y: yearOf(track) || undefined,
  };
}

const yearOf = track => { const y = +(track.release_date || track.album?.release_date || '').slice(0, 4); return y >= 1900 && y <= 2100 ? y : 0; };

function remember(c) {

  else { kept.unshift({ ...e, at: Date.now() }); delete keptRemoved[e.trackId]; bump('kept'); }
  store.set('kept', kept);
  store.set('keptRemoved', keptRemoved);

  renderPanel();
  scheduleSync();
}

const carnetOf = () => store.get('carnet', { n: 0, g: {}, d: {}, old: null });
function logCarnet(c) {
  if (c.logged) return; // un retour sur un titre déjà écouté ne compte pas deux fois
  c.logged = true;

}

// --- Synchronisation sans compte : un code secret partagé entre ses appareils ---
// Seule l'empreinte SHA-256 du code part vers la base : le code lui-même ne quitte jamais les appareils.
let keptRemoved = store.get('keptRemoved', {}); // titre retiré -> date, pour que la suppression se propage
let syncCode = store.get('syncCode', null);
let syncing = false, syncTimer = null;
const SYNC_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans I, O, 0, 1 (faciles à confondre)
const syncEl = document.getElementById('sync');

function newCode() {
  const s = [...crypto.getRandomValues(new Uint8Array(12))].map(b => SYNC_ALPHABET[b & 31]).join(''); // 60 bits
  return `SILLON-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
}
function normCode(input) {
  const s = String(input || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^SILLON/, '');
  if (s.length !== 12 || [...s].some(ch => !SYNC_ALPHABET.includes(ch))) return null;
  return `SILLON-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
}
async function keyOf(code) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function rpc(fn, body) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: SB_HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(fn + ' ' + r.status);
  return r.json();
}

// Fusion : union des gardés (une suppression plus récente l'emporte), des récents et des artistes déjà entendus.
function mergeState(r) {
  const removed = { ...(r.keptRemoved || {}) };
  for (const [id, t] of Object.entries(keptRemoved)) removed[id] = Math.max(removed[id] || 0, t);
  const byId = new Map();
  for (const k of [...(r.kept || []), ...kept]) if (!byId.has(k.trackId) || (k.at || 0) > (byId.get(k.trackId).at || 0)) byId.set(k.trackId, k);
  kept = [...byId.values()].filter(k => !((removed[k.trackId] || 0) > (k.at || 0))).sort((a, b) => (b.at || 0) - (a.at || 0));
  keptRemoved = Object.fromEntries(Object.entries(removed).sort((a, b) => b[1] - a[1]).slice(0, 500));
  const rec = new Map();
  for (const e of [...(r.recent || []), ...recent]) if (!rec.has(e.trackId) || (e.at || 0) > (rec.get(e.trackId).at || 0)) rec.set(e.trackId, e);
  recent = [...rec.values()].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 50);
  for (const a of r.seen || []) seenArtists.add(a);
  if (r.guesses) store.set('guesses', { ...r.guesses, ...guesses() });
  if (r.carnet) { // compteurs : on garde le plus grand de chaque côté
    const a = carnetOf(), b = r.carnet;
    const max = (x, y) => { const o = { ...x }; for (const k in y) o[k] = Math.max(o[k] || 0, y[k]); return o; };
    store.set('carnet', { n: Math.max(a.n, b.n || 0), g: max(a.g, b.g || {}), d: max(a.d, b.d || {}), old: !a.old || (b.old && b.old.y < a.old.y) ? b.old || a.old : a.old });
  }
  store.set('kept', kept); store.set('keptRemoved', keptRemoved); store.set('recent', recent);
  store.set('seen', [...seenArtists].slice(-20000));
  refreshKeepButtons();
  renderPanel();
}

async function syncNow() {
  if (!syncCode || syncing) return;
  syncing = true;
  clearTimeout(syncTimer);
  try {
    const key = await keyOf(syncCode);
    const [remote] = await rpc('sillon_sync_get', { p_key: key });
    if (remote?.data) mergeState(remote.data);
    const data = { v: 1, kept, keptRemoved, recent, seen: [...seenArtists].slice(-20000), guesses: guesses(), carnet: carnetOf() };
    await rpc('sillon_sync_put', { p_key: key, p_data: data });
    store.set('syncAt', Date.now());
    renderSync('ok');
  } catch { renderSync('err'); }
  finally { syncing = false; }
}
function scheduleSync() {
  if (!syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 15000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) syncNow(); else if (syncCode) scheduleSync(); });

function linkCode(raw) {
  const code = normCode(raw);
  if (!code) { renderSync('bad'); return false; }
  syncCode = code;
  store.set('syncCode', code);
  syncNow();
  return true;
}

let qrLib = null;

    const s = document.createElement('script');

}

}

// --- Image du mois (format story) : le nombre de titres gardés, leurs pochettes, quelques repères ---
// Préparée dès l'ouverture : sur téléphone, le partage de fichier doit partir directement du geste.
let recapFile = null;
async function prepareRecap(items, month) {
  const key = JSON.stringify([month, items.length]);
  prepareRecap.key = key;
  const blob = await recapImage(items, month);
  if (prepareRecap.key !== key || !blob) return;
  recapFile = new File([blob], `sillon-${month.y}-${String(month.m + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' });
  const rb = document.getElementById('recapImg');
  rb.disabled = false; rb.style.opacity = 1;
}

async function recapImage(items, { y, m }) {
  try {
    const W = 1080, H = 1920;
    const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
    const x = cv.getContext('2d');
    const covers = items.filter(k => k.cover).slice(0, 6).map(k => k.cover.replace('250x250', '500x500'));
    const [grain, ...imgs] = await Promise.all([loadImg('grain.png'), ...covers.map(loadImg)].map(p => p.catch(() => null)));
    await Promise.all([document.fonts.load('italic 750 200px Fraunces'), document.fonts.load('650 60px Fraunces'), document.fonts.load('700 30px "DM Sans"')]).catch(() => {});
    x.fillStyle = '#f4e9d4'; x.fillRect(0, 0, W, H);
    x.textAlign = 'center';
    const month = new Date(y, m, 1).toLocaleDateString(LOCALE, { month: 'long' });
    x.fillStyle = '#6b5a4a'; x.font = 'italic 650 60px Fraunces, Georgia, serif';
    x.fillText(t('recapTitle', month), W / 2, 330);
    x.font = 'italic 750 230px Fraunces, Georgia, serif';
    x.fillStyle = '#241b14'; x.fillText(items.length, W / 2 + 8, 578);
    x.fillStyle = '#e4572e'; x.fillText(items.length, W / 2, 570);
    x.fillStyle = '#241b14'; x.font = '700 34px "DM Sans", sans-serif';
    if ('letterSpacing' in x) x.letterSpacing = '5px';
    x.fillText(t('recapKept').toUpperCase(), W / 2, 650);
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    // Pochettes en grille, légèrement de travers, comme posées sur la table
    const S = 280, gap = 36, cols = 3, rows = Math.ceil(Math.min(6, items.length) / cols) || 1;
    const PAL = ['#e9b44c', '#e4572e', '#2a9d8f', '#7b4b6e', '#7fb7dc', '#a3ad62'];
    for (let i = 0; i < Math.min(6, items.length); i++) {
      const n = Math.min(cols, Math.min(6, items.length) - Math.floor(i / cols) * cols);
      const cx = W / 2 + ((i % cols) - (n - 1) / 2) * (S + gap), cy = 740 + S / 2 + Math.floor(i / cols) * (S + gap);
      x.save(); x.translate(cx, cy); x.rotate(((i * 37) % 7 - 3) * Math.PI / 180);
      x.fillStyle = 'rgba(36,27,20,.85)'; x.fillRect(-S / 2 + 8, -S / 2 + 10, S, S);
      x.fillStyle = PAL[i]; x.fillRect(-S / 2, -S / 2, S, S);
      if (imgs[i]) x.drawImage(imgs[i], -S / 2, -S / 2, S, S);
      x.restore();
    }
    const genres = new Set(items.map(k => k.g).filter(Boolean)).size;
    const oldest = Math.min(...items.map(k => k.y || 9999));
    const facts = t('recapFacts', genres, oldest < 9999 ? oldest : 0);
    const fy = 740 + rows * (S + gap) + 70;
    x.fillStyle = '#6b5a4a'; x.font = 'italic 500 44px Fraunces, Georgia, serif';
    if (facts) x.fillText(facts, W / 2, fy);
    x.font = '700 40px "DM Sans", sans-serif';
    const label = location.hostname.endsWith('sillon.cloud') ? 'sillon.cloud' : location.host;
    const pw = x.measureText(label).width + 90, ph = 96, px = (W - pw) / 2, py = Math.min(H - 400, fy + 70);
    const pill = (ox, oy) => { x.beginPath(); x.roundRect(px + ox, py + oy, pw, ph, ph / 2); };
    x.fillStyle = '#241b14'; pill(7, 7); x.fill();
    x.fillStyle = '#e9b44c'; pill(0, 0); x.fill();
    x.lineWidth = 4; x.strokeStyle = '#241b14'; x.stroke();
    x.fillStyle = '#241b14'; x.textBaseline = 'middle'; x.fillText(label, W / 2, py + ph / 2 + 2);
    if (grain) { x.globalCompositeOperation = 'multiply'; x.globalAlpha = .55; x.fillStyle = x.createPattern(grain, 'repeat'); x.fillRect(0, 0, W, H); }
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .92));
  } catch { return null; }
}

  await copyText(asText(exportItems()));
  setHint(t('playlistHint'));
  open('https://www.tunemymusic.com/transfer', '_blank', 'noopener');
};

// Sauvegarde complète dans un fichier (filet de sécurité si le code de synchronisation est perdu).
document.getElementById('backupSave').onclick = async () => {
  const data = { app: 'sillon', v: 1, exported: new Date().toISOString(), kept, keptRemoved, recent, seen: [...seenArtists].slice(-20000) };
  const name = `sillon-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Sauvegarde Sillon' }); return; } catch {} }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
document.getElementById('backupLoad').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'sillon') throw new Error();
    mergeState(data);
    syncNow();
    renderExport();
    setHint(t('restored', kept.length));
  } catch { setHint(t('badFile')); }
};

document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => {
  if (e.target === s || e.target.closest('[data-close]')) s.classList.remove('open');
}));

// Une fois par mois, à la première ouverture : récap des titres gardés le mois précédent.
function maybeRecap() {
  const now = new Date();
  const key = `${now.getFullYear()}-${now.getMonth()}`;
  if (store.get('recapSeen', null) === key) return;
  store.set('recapSeen', key);
  const prev = { y: new Date(now.getFullYear(), now.getMonth() - 1, 1).getFullYear(), m: new Date(now.getFullYear(), now.getMonth() - 1, 1).getMonth() };
  if (kept.some(k => inMonth(k, prev))) openExport('month', prev);
}

// --- Clavier ---
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const open = document.querySelector('.sheet.open, #sync.open');
  if (e.key === 'Escape') {
    if (open) open.classList.remove('open');
    else if (panelMode) openPanel(panelMode);
    return;
  }
  if (open) return;
  const start = document.getElementById('start');
  if (start) { if (e.key === 'Enter' && !e.target.closest('button')) document.getElementById('go').click(); return; }
  const c = cards[current];
  const key = e.key.toLowerCase();
  if (e.key === 'ArrowDown' || key === 'j') { e.preventDefault(); go(current + 1); }
  else if (e.key === 'ArrowUp' || key === 'k') { e.preventDefault(); go(current - 1); }
  else if (e.key === ' ' && !e.target.closest('button, a, [role=button]')) { e.preventDefault(); togglePlay(); }
  else if (key === 'l' || key === 'g') c?.el.querySelector('.keep')?.click();
  else if (key === 's') c?.el.querySelector('.share')?.click();
  else if (key === 'b') document.getElementById('blindBtn').click();
  else if (key === 'r' && c) reveal(c);
});

// --- Démarrage (le navigateur exige un geste pour lancer le son) ---
document.getElementById('go').onclick = () => {
  const start = document.getElementById('start');
  start.classList.add('drop');
  setTimeout(() => start.remove(), 900);
  audio.play().catch(() => {});
  if (current < 0) setCurrent(0); // sans attendre la détection de la carte visible
  else play(current);
  maybeRecap();
};
// --- Partage d'un titre : le lien ouvre Sillon sur ce titre, puis le hasard reprend ---
// ?t=123 pour Deezer, ?t=ap:123 pour Apple Music.
const shareUrl = (track, msg) => `${location.origin}${location.pathname}?t=${encodeURIComponent(track.id)}${msg ? '&m=' + encodeURIComponent(msg) : ''}`;

// Le partage ouvre une fiche : l'image pour une story (préparée dès l'ouverture, car le partage
// de fichier doit partir directement du geste) ou le lien.
const shareEl = document.getElementById('share');
let shareCard = null, storyFile = null;

function shareTrack(c) {
  if (!c.data) return;
  reveal(c); // on ne partage pas un titre qu'on n'a pas vu
  const { track, artist } = c.data;
  shareCard = c;
  storyFile = null;
  document.getElementById('shareTitle').textContent = `${artist.name} – ${track.title}`;
  const img = document.getElementById('sharePreview');
  img.removeAttribute('src');
  document.getElementById('shareNote').value = '';
  const btn = document.getElementById('shareStory');
  btn.disabled = true;
  shareEl.classList.add('open');
  storyImage(c).then(blob => {
    if (shareCard !== c || !blob) return;
    const slug = `${artist.name}-${track.title}`.normalize('NFD').replace(/\p{M}/gu, '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 60).toLowerCase();
    storyFile = new File([blob], `sillon-${slug || 'titre'}.jpg`, { type: 'image/jpeg' });
    if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(blob);
    btn.disabled = false;
  });
}

document.getElementById('shareLink').onclick = async () => {
  const c = shareCard;
  if (!c?.data) return;
  const { track, artist } = c.data;
  bump('shares');
  const url = shareUrl(track, document.getElementById('shareNote').value.trim().slice(0, 140));
  const text = `${artist.name} – ${track.title}`;
  shareEl.classList.remove('open');
  if (navigator.share) {
    try { await navigator.share({ title: 'Sillon', text, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  toast(await copyText(`${text}\n${url}`) ? t('linkCopied') : t('copyFailed'));
};

document.getElementById('shareStory').onclick = async () => {
  if (!storyFile) return;
  bump('story_shares');
  if (navigator.canShare?.({ files: [storyFile] })) {
    try { await navigator.share({ files: [storyFile] }); shareEl.classList.remove('open'); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(storyFile), download: storyFile.name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(t('imageSaved'));
};

// --- Image 1080x1920 aux couleurs de la carte : pochette et disque, titre, artiste, adresse ---
const loadImg = src => new Promise((ok, ko) => {
  const i = new Image();
  i.crossOrigin = 'anonymous'; // Deezer et Apple autorisent : l'image reste exportable
  i.onload = () => ok(i); i.onerror = ko;
  i.src = src;
});

// Coupe le titre en 3 lignes au plus, en réduisant la taille si besoin.
function fitLines(x, text, maxW, size, minSize, font) {
  for (; size >= minSize; size -= 4) {
    x.font = font(size);
    const lines = [];
    let line = '';
    for (const w of String(text).split(/\s+/)) {
      const test = line ? line + ' ' + w : w;
      if (!line || x.measureText(test).width <= maxW) line = test; else { lines.push(line); line = w; }
    }
    lines.push(line);
    if (lines.length <= 3 && lines.every(l => x.measureText(l).width <= maxW)) return { lines, size };
  }
  // Mots trop longs : on coupe lettre par lettre
  x.font = font(minSize);
  const lines = [];
  let line = '';
  for (const ch of String(text)) {
    if (line && x.measureText(line + ch).width > maxW) { lines.push(line); line = ch.trim(); } else line += ch;
  }
  lines.push(line);
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].slice(0, -1) + '…'; }
  return { lines, size: minSize };
}

async function storyImage(c) {
  try {
    const { track, artist } = c.data;
    const W = 1080, H = 1920;
    const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
    const x = cv.getContext('2d');
    const st = getComputedStyle(c.el);
    const [bg, fg, ac] = ['--bg', '--fg', '--ac'].map(v => st.getPropertyValue(v).trim());
    const coverUrl = track.album?.cover_xl || track.album?.cover_big || '';
    const [cover, grain] = await Promise.all([
      coverUrl ? loadImg(coverUrl).catch(() => null) : null,
      loadImg('grain.png').catch(() => null),
      document.fonts.load('650 90px Fraunces'), document.fonts.load('italic 750 60px Fraunces'), document.fonts.load('700 30px "DM Sans"'),
    ].map(p => Promise.resolve(p).catch(() => null)));

    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    let g = x.createRadialGradient(W / 2, 640, 0, W / 2, 640, 1100);
    g.addColorStop(0, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    g = x.createLinearGradient(0, H * .55, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.16)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillStyle = fg;
    x.globalAlpha = .8; x.font = '700 30px "DM Sans", sans-serif';
    if ('letterSpacing' in x) x.letterSpacing = '6px';
    x.fillText(t('foundOn').toUpperCase(), W / 2, 330); // hors des zones masquées par Instagram (haut et bas)
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    x.globalAlpha = 1;

    // Pochette et disque qui en sort, comme dans l'appli
    const S = 600, X0 = (W - S * 1.42) / 2, Y0 = 420;
    const dx = X0 + S * .5 + S * .46 + S * .05, dy = Y0 + S / 2, R = S * .47;
    x.save(); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 40; x.shadowOffsetY = 16;
    x.fillStyle = '#1c1612'; x.beginPath(); x.arc(dx, dy, R, 0, Math.PI * 2); x.fill(); x.restore();
    x.strokeStyle = '#2b231d'; x.lineWidth = 2;
    for (let r = R * .38; r < R - 4; r += 7) { x.beginPath(); x.arc(dx, dy, r, 0, Math.PI * 2); x.stroke(); }
    x.save(); x.beginPath(); x.arc(dx, dy, R * .36, 0, Math.PI * 2); x.clip();
    if (cover) x.drawImage(cover, dx - R * .36, dy - R * .36, R * .72, R * .72); else { x.fillStyle = ac; x.fill(); }
    x.restore();
    x.fillStyle = '#f4e9d4'; x.beginPath(); x.arc(dx, dy, R * .03, 0, Math.PI * 2); x.fill();

    x.fillStyle = 'rgba(0,0,0,.2)'; x.fillRect(X0 + 12, Y0 + 18, S, S);
    x.save(); x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 50; x.shadowOffsetY = 26;
    x.fillStyle = ac; x.fillRect(X0, Y0, S, S); x.restore();
    if (cover) x.drawImage(cover, X0, Y0, S, S);
    else {
      x.fillStyle = '#f4e9d4'; x.font = 'italic 750 300px Fraunces, serif'; x.textBaseline = 'middle';
      x.fillText('♪', X0 + S / 2, Y0 + S / 2); x.textBaseline = 'alphabetic';
    }
    x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = 2; x.strokeRect(X0 + 1, Y0 + 1, S - 2, S - 2);

    // Titre et artiste
    const serif = s => `650 ${s}px Fraunces, Georgia, serif`;
    const { lines, size } = fitLines(x, track.title, W - 160, 96, 56, serif);
    x.fillStyle = fg; x.font = serif(size);
    let y = Y0 + S + 150;
    for (const l of lines) { x.fillText(l, W / 2, y); y += size * 1.12; }
    x.font = '700 34px "DM Sans", sans-serif'; x.globalAlpha = .85;
    if ('letterSpacing' in x) x.letterSpacing = '5px';
    const { lines: al } = fitLines(x, artist.name.toUpperCase(), W - 160, 34, 26, s => `700 ${s}px "DM Sans", sans-serif`);
    x.fillText(al[0] + (al.length > 1 ? '…' : ''), W / 2, y + 30);
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    x.globalAlpha = 1;

    // Étiquette sillon.cloud
    x.font = '700 40px "DM Sans", sans-serif';
    const label = location.hostname.endsWith('sillon.cloud') ? 'sillon.cloud' : location.host;
    const pw = x.measureText(label).width + 90, ph = 96, px = (W - pw) / 2, py = H - 400;
    const pill = (ox, oy) => { x.beginPath(); x.roundRect(px + ox, py + oy, pw, ph, ph / 2); };
    x.fillStyle = '#241b14'; pill(7, 7); x.fill();
    x.fillStyle = '#e9b44c'; pill(0, 0); x.fill();
    x.lineWidth = 4; x.strokeStyle = '#241b14'; x.stroke();
    x.fillStyle = '#241b14'; x.textBaseline = 'middle'; x.fillText(label, W / 2, py + ph / 2 + 2);

    if (grain) {
      x.globalCompositeOperation = 'multiply'; x.globalAlpha = .55;
      x.fillStyle = x.createPattern(grain, 'repeat'); x.fillRect(0, 0, W, H);
    }
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .92));
  } catch { return null; }
}

// Titre du jour : tiré au hasard dans la réserve chaque matin (tools/pick-daily.js), le même pour tout le monde.
const dailyEntry = fetch('pool/daily.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)
  .then(d => (d?.i && GENRES[d.g] && d.y ? (daily = d) : null));

async function loadShared(id) {
  if (id === 'daily') {
    const d = await dailyEntry;
    const r = d && await loadShared(String(d.i));
    if (r) r.album = { ...r.album, genre_id: d.g }; // pour le carnet
    return r;
  }
  if (/^ap:\d+$/.test(id)) {
    const res = await fetch(`https://itunes.apple.com/lookup?country=${APPLE_COUNTRY}&id=${id.slice(3)}`).then(r => r.json());
    const t = (res.results || []).find(x => x.kind === 'song' && x.previewUrl);
    return t ? appleEntry(t) : null;
  }
  if (/^\d+$/.test(id)) {
    const tr = await dz('/track/' + id);
    return tr.preview ? { track: tr, artist: tr.artist, album: tr.album } : null;
  }
  return null;
}

// L'accueil annonce ce qu'on vous a envoyé : la pochette sur l'étiquette du disque, et le mot de l'expéditeur.
const note = (params.get('m') || '').trim().slice(0, 140);
function announce(html, cover) {
  const start = document.getElementById('start');
  if (!start) return;
  if (cover) {
    const label = start.querySelector('.label');
    label.style.backgroundImage = `url('${cover}')`;
    label.style.backgroundSize = 'cover';
    label.querySelector('span')?.remove();
  }
  start.querySelector('p').innerHTML = html + (note ? `<br><span class="note">${t('noteIntro')} « ${esc(note)} »</span>` : '');
}
function announceShared({ track, artist }) {
  announce(`${t('sharedIntro')}<br><em>${esc(track.title)}</em> · ${esc(artist.name)}`, track.album?.cover_xl || track.album?.cover_medium || '');
}

// Carte dont le titre est connu d'avance (lien partagé, bac, devinette) ; si elle échoue, le hasard prend le relais.
function fillWith(c, id, onLoad) {
  pending++;
  loadShared(id)
    .then(d => { if (!d) throw new Error('introuvable'); seenArtists.add(d.artist.id); fill(c, d); onLoad?.(d); })
    .catch(() => { c.daily = false; return findTrack().then(d => fill(c, d)).catch(() => { c.failed = true; }); })
    .finally(() => { pending--; topUp(); });
}

// Liens reçus. ?platine=CODE : même suite pour tous. ?bac=1.2.3 : les titres gardés d'un ami.
// ?t=123 : un titre partagé. ?jour (ou ?today) : la devinette du jour. &m= : un mot de l'expéditeur.
const sharedId = params.get('t') || (params.has('jour') || params.has('today') ? 'daily' : null);
const bacIds = (params.get('bac') || '').split('.').filter(x => /^(ap:)?\d{1,12}$/.test(x)).slice(0, 20);
const dailyBtn = document.getElementById('daily');
if (platine) {
  queueMicrotask(() => bump('platine_opens')); // une fois le module de mesure (plus bas) initialisé
  announce(t('platineIntro', platine));
  dailyBtn.textContent = t('platineInvite');
  dailyBtn.hidden = false;
  dailyBtn.onclick = () => invitePlatine();
} else if (bacIds.length) {
  queueMicrotask(() => bump('bac_opens'));
  history.replaceState(null, '', location.pathname);
  announce(t('bacIntro', bacIds.length));
  bacIds.forEach(id => fillWith(placeholder(), id));
} else if (sharedId) {
  queueMicrotask(() => bump(sharedId === 'daily' ? 'daily_opens' : 'shared_opens'));
  history.replaceState(null, '', location.pathname);
  const c = placeholder();
  if (sharedId === 'daily') {
    c.daily = true; // rien du titre sur l'accueil : c'est une devinette
    dailyEntry.then(d => d && announce(t('dailyIntro', d.n)));
    fillWith(c, 'daily');
  } else fillWith(c, sharedId, announceShared);
} else {
  dailyEntry.then(d => { if (d) dailyBtn.hidden = false; });
  // Bouton « Devinette du jour » de l'accueil : la carte passe en tête du fil, avant les titres déjà tirés.
  dailyBtn.onclick = () => {
    bump('daily_opens');
    const c = placeholder();
    c.daily = true;
    feed.prepend(c.el);
    cards.pop(); cards.unshift(c);
    if (current >= 0) current++;
    feed.scrollTop = 0;
    setCurrent(0);
    fillWith(c, 'daily');
    document.getElementById('go').click();
  };
}

// --- Mesure d'audience anonyme : compteurs agrégés par jour, aucun identifiant envoyé ---
// Rétention : chaque téléphone envoie au plus un « passage » par jour avec la date de sa première visite.
const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
let statsOn = store.get('stats', true);
const statCounts = {};
function bump(k) { if (statsOn) statCounts[k] = (statCounts[k] || 0) + 1; }
function refOf() {
  const h = (() => { try { return new URL(document.referrer).hostname; } catch { return ''; } })();
  if (!h || h === location.hostname) return 'direct';
  const map = [[/reddit/, 'reddit'], [/ycombinator/, 'hackernews'], [/tiktok/, 'tiktok'], [/instagram/, 'instagram'], [/youtube|youtu\.be/, 'youtube'],
    [/bsky/, 'bluesky'], [/mastodon|mstdn/, 'mastodon'], [/^t\.co$|twitter|x\.com/, 'x'], [/threads/, 'threads'], [/facebook|fb\./, 'facebook'],
    [/linkedin|lnkd/, 'linkedin'], [/discord/, 'discord'], [/producthunt/, 'producthunt'], [/google|bing|duckduckgo|qwant|ecosia/, 'search'], [/github/, 'github']];
  return (map.find(([re]) => re.test(h)) || [, 'other'])[1];
}
function flushStats() {
  if (!statsOn) return;
  const day = localDay();
  const newDay = store.get('lastPing', null) !== day;
  if (!newDay && !Object.keys(statCounts).length) return;
  let first = store.get('firstDay', null);
  if (!first) { first = day; store.set('firstDay', first); }
  const counts = { ...statCounts };
  if (newDay && matchMedia('(display-mode: standalone)').matches) counts.installed = 1;
  Object.keys(statCounts).forEach(k => delete statCounts[k]);
  store.set('lastPing', day);
  fetch(SB_URL + '/rest/v1/rpc/sillon_track', {
    method: 'POST', headers: SB_HEADERS, keepalive: true,
    body: JSON.stringify({ p_day: day, p_first_day: first, p_new_day: newDay, p_ref: first === day ? refOf() : null, p_counts: counts }),
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushStats(); });
setInterval(flushStats, 5 * 60000);

const statsToggle = document.getElementById('statsToggle');
statsToggle.checked = statsOn;
statsToggle.onchange = () => {
  statsOn = statsToggle.checked;
  store.set('stats', statsOn);
  if (!statsOn) Object.keys(statCounts).forEach(k => delete statCounts[k]);
};
document.getElementById('aboutBtn').onclick = () => document.getElementById('about').classList.add('open');

renderPanel();
topUp();
flushStats();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
